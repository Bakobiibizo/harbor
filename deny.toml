[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib"
]

[advisories]
ignore = [
  # Transitive through libp2p's Linux if-watch/netlink stack. The advisory has
  # no safe upgrade; this crate is a compile-time macro and not a runtime parser.
  { id = "RUSTSEC-2024-0436", reason = "No safe upstream upgrade is available in libp2p 0.56" },
  { id = "RUSTSEC-2026-0118", reason = "libp2p 0.56 pins hickory 0.25; Harbor does not enable hickory DNSSEC validation" },
  { id = "RUSTSEC-2026-0119", reason = "libp2p-mdns 0.48 pins hickory 0.25 and no newer libp2p release is available" },
  { id = "RUSTSEC-2025-0057", reason = "Transitive through scraper selectors; no maintained upstream replacement is available" },
  { id = "RUSTSEC-2024-0370", reason = "Transitive GTK3 build dependency required by Tauri on Linux" },
  { id = "RUSTSEC-2024-0411", reason = "Tauri Linux runtime currently requires GTK3 bindings" },
