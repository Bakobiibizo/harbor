# Linux/macOS devkit configuration
# Frontend: TypeScript/pnpm at project root
# Backend: Rust at src-tauri/

default_language = "rust"

# ===================== TypeScript/Frontend ========================

[tasks.ts_fmt]
commands = [["pnpm", "exec", "prettier", "--write", "src/**/*.{ts,tsx,js,jsx,css,html}"]]

[tasks.ts_lint]
commands = [["pnpm", "exec", "eslint", "src", "--fix"]]

[tasks.ts_lint_check]
commands = [["pnpm", "exec", "eslint", "src"]]

[tasks.ts_type]
commands = [["pnpm", "exec", "tsc", "--noEmit"]]

[tasks.ts_test]
commands = [["pnpm", "run", "test"]]

[tasks.ts_build]
commands = [["pnpm", "run", "build"]]

[tasks.ts_fix]
commands = [
  "ts_fmt",
  "ts_lint"
]

[tasks.ts_check]
commands = [
  "ts_type",
  "ts_lint_check"
]

[tasks.ts_ci]
commands = [
  "ts_type",
  "ts_lint_check",
  "ts_test",
  "ts_build"
]

# ===================== Rust/Backend ========================

[tasks.rust_fmt]
commands = [["cargo", "fmt", "--manifest-path", "src-tauri/Cargo.toml"]]

[tasks.rust_fmt_check]
commands = [["cargo", "fmt", "--manifest-path", "src-tauri/Cargo.toml", "--", "--check"]]

[tasks.rust_lint]
commands = [["cargo", "clippy", "--manifest-path", "src-tauri/Cargo.toml"]]

[tasks.rust_lint_check]
commands = [["cargo", "clippy", "--manifest-path", "src-tauri/Cargo.toml", "--", "-D", "warnings"]]

[tasks.rust_check]
commands = [["cargo", "check", "--manifest-path", "src-tauri/Cargo.toml"]]

[tasks.rust_test]
commands = [["cargo", "test", "--manifest-path", "src-tauri/Cargo.toml"]]

[tasks.rust_build]
commands = [["cargo", "build", "--manifest-path", "src-tauri/Cargo.toml"]]

[tasks.rust_fix]
commands = [
  "rust_fmt"
]

[tasks.rust_ci]
commands = [
  "rust_fmt_check",
  "rust_lint_check",
  "rust_check",
  "rust_test"
]

# ===================== Relay Server ========================

[tasks.relay_build]
commands = [["bash", "scripts/build-relay.sh"]]

[tasks.relay_check]
commands = [["cargo", "check", "--manifest-path", "relay-server/Cargo.toml"]]

[tasks.relay_fmt]
commands = [["cargo", "fmt", "--manifest-path", "relay-server/Cargo.toml"]]

[tasks.relay_fmt_check]
commands = [["cargo", "fmt", "--manifest-path", "relay-server/Cargo.toml", "--", "--check"]]

[tasks.relay_clippy]
commands = [["cargo", "clippy", "--manifest-path", "relay-server/Cargo.toml", "--", "-D", "warnings"]]

[tasks.relay_test]
commands = [["cargo", "test", "--manifest-path", "relay-server/Cargo.toml"]]

[tasks.relay_ci]
commands = [
  "relay_fmt_check",
  "relay_check",
  "relay_clippy",
  "relay_test"
]

# ===================== Combined/Tauri ========================

[tasks.fmt_all]
commands = [
  "ts_fmt",
  "rust_fmt"
]

[tasks.fix_all]
commands = [
  "ts_fix",
  "rust_fix"
]

[tasks.check_all]
commands = [
  "ts_check",
  "rust_lint_check"
]

[tasks.tauri_dev]
commands = [["pnpm", "run", "tauri", "dev"]]

[tasks.tauri_build]
commands = [["pnpm", "run", "tauri", "build"]]

# ===================== Language Pipelines ========================

[languages.typescript]
install = [["pnpm", "install", "--frozen-lockfile"]]

[languages.typescript.pipelines]
fmt = ["ts_fmt"]
lint = ["ts_lint_check"]
type = ["ts_type"]
test = ["ts_test"]
fix = ["ts_fix"]
check = ["ts_check"]
ci = ["ts_ci"]

[languages.rust]
install = []

[languages.rust.pipelines]
fmt = ["rust_fmt"]
lint = ["rust_lint_check"]
type = ["rust_check"]
test = ["rust_test"]
fix = ["rust_fix"]
check = ["rust_ci"]
ci = ["rust_ci"]

# ===================== Setup ========================

[setup]
extra_packages = [
  "libglib2.0-dev",
  "libgtk-3-dev",
  "libwebkit2gtk-4.1-dev",
  "libappindicator3-dev",
  "librsvg2-dev",
  "patchelf"
]
