name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  VITE_HARBOR_RELAY_NAMESPACE: harbor.social

permissions:
  contents: write
  id-token: write

jobs:
  release-validation:
    name: Release validation gates
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify updater signing configuration
        run: |
          ! grep -q 'UPDATER_PUBKEY_PLACEHOLDER' src-tauri/tauri.conf.json
          grep -q 'github.com/bakobiibizo/harbor' src-tauri/tauri.conf.json

      - name: Install frontend tooling
        run: .dev/bin/dev --language typescript install

      - name: Frontend TypeScript CI
        run: .dev/bin/dev --language typescript ci

      - name: Tauri/Rust CI
        run: .dev/bin/dev --language rust ci

      - name: Relay CI
        run: .dev/bin/dev run relay_ci

  create-release:
    needs: release-validation
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            let release;
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const existing = releases.find(item => item.tag_name === `v${version}` && item.draft);
              if (!existing) throw Object.assign(new Error('draft not found'), { status: 404 });
              release = { data: existing };
              if (!release.data.draft) {
                core.setFailed(`v${version} is already published`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${version}`,
                target_commitish: context.sha,
                name: `Harbor v${version}`,
                draft: true,
                prerelease: version.includes('-'),
                generate_release_notes: true
              });
            }
            core.setOutput('id', release.data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            # MSI only accepts numeric prerelease identifiers. NSIS supports the
            # product's SemVer beta version and still produces updater artifacts.
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Load signing secrets from 1Password
        if: runner.os != 'Windows'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_BAKO }}
          TAURI_SIGNING_PRIVATE_KEY: op://bako/TAURI_SIGNING_PRIVATE_KEY/password
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://bako/TAURI_SIGNING_PRIVATE_KEY_PASSWORD/password

      - name: Normalize signing key
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Install 1Password CLI on Windows
        if: runner.os == 'Windows'
        uses: 1password/install-cli-action@v2

      - name: Load signing secrets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_BAKO }}
        run: |
          $key = (op read 'op://bako/TAURI_SIGNING_PRIVATE_KEY/password') -replace '\s', ''
          $password = op read 'op://bako/TAURI_SIGNING_PRIVATE_KEY_PASSWORD/password'
          Write-Output "::add-mask::$key"
          Write-Output "::add-mask::$password"
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build non-Windows Tauri app
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle

      - name: Azure login to sign Windows executable
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: social-harbor
          certificate-profile-name: social-harbor
          files: ${{ github.workspace }}\src-tauri\target\release\harbor.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Harbor
          description-url: https://harbor.social

      - name: Verify signed Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'src-tauri/target/release/harbor.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows executable Authenticode status is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Bundle signed Windows executable
        if: runner.os == 'Windows'
        run: pnpm tauri bundle --bundles nsis

      - name: Refresh Azure login to sign Windows installer
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: social-harbor
          certificate-profile-name: social-harbor
          files: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\Harbor_${{ needs.create-release.outputs.version }}_x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Harbor
          description-url: https://harbor.social

      - name: Verify and sign Windows updater artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/Harbor_${{ needs.create-release.outputs.version }}_x64-setup.exe"
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer Authenticode status is $($signature.Status): $($signature.StatusMessage)"
          }
          pnpm tauri signer sign $installer

      - name: Upload signed Windows updater artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          gh release upload "v${{ needs.create-release.outputs.version }}" `
            "$bundle/Harbor_${{ needs.create-release.outputs.version }}_x64-setup.exe" `
            "$bundle/Harbor_${{ needs.create-release.outputs.version }}_x64-setup.exe.sig" `
            --clobber

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets
          gh release download "v${VERSION}" \
            --pattern latest.json \
            --pattern "Harbor_${VERSION}_x64-setup.exe.sig" \
            --dir release-assets
          node scripts/finalize-updater-manifest.mjs \
            release-assets/latest.json \
            "${VERSION}" \
            "release-assets/Harbor_${VERSION}_x64-setup.exe.sig" \
            release-assets/final-latest.json
          mv release-assets/final-latest.json release-assets/latest.json
          gh release upload "v${VERSION}" release-assets/latest.json --clobber
          gh release upload updater-channel release-assets/latest.json --clobber

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
