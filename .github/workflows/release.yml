name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  VITE_HARBOR_RELAY_NAMESPACE: harbor.social

permissions:
  contents: write

jobs:
  release-validation:
    name: Release validation gates
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify updater signing configuration
        run: |
          ! grep -q 'UPDATER_PUBKEY_PLACEHOLDER' src-tauri/tauri.conf.json
          grep -q 'github.com/bakobiibizo/harbor' src-tauri/tauri.conf.json

      - name: Install frontend tooling
        run: .dev/bin/dev --language typescript install

      - name: Frontend TypeScript CI
        run: .dev/bin/dev --language typescript ci

      - name: Tauri/Rust CI
        run: .dev/bin/dev --language rust ci

      - name: Relay CI
        run: .dev/bin/dev run relay_ci

  create-release:
    needs: release-validation
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            let release;
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const existing = releases.find(item => item.tag_name === `v${version}` && item.draft);
              if (!existing) throw Object.assign(new Error('draft not found'), { status: 404 });
              release = { data: existing };
              if (!release.data.draft) {
                core.setFailed(`v${version} is already published`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${version}`,
                target_commitish: context.sha,
                name: `Harbor v${version}`,
                draft: true,
                prerelease: version.includes('-'),
                generate_release_notes: true
              });
            }
            core.setOutput('id', release.data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            # MSI only accepts numeric prerelease identifiers. NSIS supports the
            # product's SemVer beta version and still produces updater artifacts.
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Load signing secrets from 1Password
        if: runner.os != 'Windows'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_BAKO }}
          TAURI_SIGNING_PRIVATE_KEY: op://bako/TAURI_SIGNING_PRIVATE_KEY/password
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://bako/TAURI_SIGNING_PRIVATE_KEY_PASSWORD/password

      - name: Normalize signing key
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Install 1Password CLI on Windows
        if: runner.os == 'Windows'
        uses: 1password/install-cli-action@v2

      - name: Load signing secrets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_BAKO }}
        run: |
          $key = (op read 'op://bako/TAURI_SIGNING_PRIVATE_KEY/password') -replace '\s', ''
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(op read 'op://bako/TAURI_SIGNING_PRIVATE_KEY_PASSWORD/password')" >> $env:GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
