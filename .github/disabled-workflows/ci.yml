name: CI

# Disabled operational reference: Harbor CI is run on project-owned Windows,
# Linux x86_64, and Linux ARM64 hosts through scripts/build-platform-matrix.sh.
# Keeping this file outside .github/workflows prevents GitHub Actions charges.

on:
  push:
    branches: [main, master, release-candidate]
  pull_request:
    branches: [main, master, release-candidate]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VITE_HARBOR_RELAY_NAMESPACE: harbor.social

jobs:
  frontend:
    name: Frontend CI
    runs-on: self-hosted
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - name: Verify global devkit
        run: dev --version
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend tooling
        run: dev --language typescript install

      - name: run frontend ci
        run: dev --language typescript ci

      - name: run packaged call harness regression
        run: pnpm test:call-harness

  backend:
    name: Backend CI
    runs-on: self-hosted
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify global devkit
        run: dev --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install rust tooling
        run: dev --language rust install

      - name: run backend ci
        run: dev --language rust ci

  relay:
    name: Relay CI
    runs-on: self-hosted
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify global devkit
        run: dev --version

      - name: Run relay CI
        run: dev run relay_ci
