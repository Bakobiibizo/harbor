AWSTemplateFormatVersion: '2010-09-09'
Description: 'Harbor Community Relay Server - NAT traversal + community boards with storage'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Instance Configuration'
        Parameters:
          - InstanceType
          - KeyPairName
      - Label:
          default: 'Relay Configuration'
        Parameters:
          - RelayPort
          - IdentityNamespace
          - MaxReservations
          - MaxReservationsPerPeer
          - MaxCircuits
          - MaxCircuitsPerPeer
          - ReservationDurationSecs
          - MaxCircuitDurationSecs
          - MaxCircuitBytes
          - IdleConnectionTimeoutSecs
          - ReservationAdmissionPerPeer
          - ReservationAdmissionPerIp
          - CircuitAdmissionPerPeer
          - CircuitAdmissionPerIp
          - AdmissionWindowSecs
          - RateLimitMaxRequests
          - RateLimitWindowSecs
          - RateLimiterCleanupIntervalSecs
          - AbusePeerLimit
          - AbuseNetworkLimit
          - AbuseTargetLimit
          - AbuseActionLimit
          - AbuseGlobalLimit
          - AbuseWindowSecs
          - MaxStorageBytes
          - MaxEphemeralEntries
          - EphemeralRetentionSecs
          - MaxAdmissionSources
          - RecordRetentionSecs
          - MaxKnownPeers
          - MaxPosts
          - MaxGrants
          - MaxIntroductions
          - MaxSocialEvents
      - Label:
          default: 'Community Configuration'
        Parameters:
          - CommunityName

Parameters:
  IdentityNamespace:
    Type: String
    MinLength: 3
    MaxLength: 253
    AllowedPattern: '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    ConstraintDescription: 'Use a lowercase DNS hostname without a scheme, port, path, or trailing dot.'
    Description: 'Relay-scoped identity namespace, for example relay.example.com. You must control this DNS name.'

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t2.small
      - t3.small
    Description: 'EC2 instance type. t2.micro and t3.micro are free tier eligible (750 hours/month)'

  KeyPairName:
    Type: String
    Default: ''
    Description: '(Optional) EC2 key pair name for SSH access. Leave empty to disable SSH.'

  RelayPort:
    Type: Number
    Default: 4001
    MinValue: 1024
    MaxValue: 65535
    Description: 'Port for the libp2p relay server'

  MaxReservations:
    Type: Number
    Default: 128
    MinValue: 1
    MaxValue: 100000
    Description: 'Maximum concurrent relay reservations'

  MaxReservationsPerPeer:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 100000
    Description: 'Maximum concurrent reservations per peer'

  MaxCircuits:
    Type: Number
    Default: 512
    MinValue: 1
    MaxValue: 100000
    Description: 'Maximum concurrent relay circuits'

  MaxCircuitsPerPeer:
    Type: Number
    Default: 16
    MinValue: 1
    MaxValue: 100000
    Description: 'Maximum concurrent circuits per peer'

  ReservationDurationSecs:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 86400
    Description: 'Reservation lease duration in seconds'

  MaxCircuitDurationSecs:
    Type: Number
    Default: 3600
    MinValue: 30
    MaxValue: 86400
    Description: 'Maximum circuit lifetime in seconds'

  MaxCircuitBytes:
    Type: Number
    Default: 67108864
    MinValue: 1048576
    MaxValue: 17179869184
    Description: 'Maximum bytes forwarded by one circuit'

  IdleConnectionTimeoutSecs:
    Type: Number
    Default: 300
    MinValue: 15
    MaxValue: 3600
    Description: 'Idle swarm connection timeout in seconds'

  ReservationAdmissionPerPeer:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1000000
    Description: 'Reservation admissions per peer per admission window'

  ReservationAdmissionPerIp:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1000000
    Description: 'Reservation admissions per source IP per admission window'

  CircuitAdmissionPerPeer:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1000000
    Description: 'Circuit admissions per peer per admission window'

  CircuitAdmissionPerIp:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1000000
    Description: 'Circuit admissions per source IP per admission window'

  AdmissionWindowSecs:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 86400
    Description: 'Relay admission-rate window in seconds'

  RateLimitMaxRequests:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1000000
    Description: 'Identity and community protocol requests per peer per window'

  RateLimitWindowSecs:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 86400
    Description: 'Identity and community protocol rate-limit window in seconds'

  RateLimiterCleanupIntervalSecs:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 86400
    Description: 'Stale admission counter cleanup interval in seconds'

  AbusePeerLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000000
    Description: 'Introduction admissions per peer per abuse window'

  AbuseNetworkLimit:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1000000
    Description: 'Introduction admissions per network prefix per abuse window'

  AbuseTargetLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 1000000
    Description: 'Introduction admissions per target per abuse window'

  AbuseActionLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000000
    Description: 'Introduction admissions per action per abuse window'

  AbuseGlobalLimit:
    Type: Number
    Default: 1000
    MinValue: 1
    MaxValue: 1000000
    Description: 'Global introduction admissions per abuse window'

  AbuseWindowSecs:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 86400
    Description: 'Introduction abuse-control window in seconds'

  MaxStorageBytes:
    Type: Number
    Default: 1073741824
    MinValue: 16777216
    MaxValue: 1099511627776
    Description: 'Maximum bytes for persistent relay SQLite state'

  MaxEphemeralEntries:
    Type: Number
    Default: 10000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum entries in each bounded in-memory state collection'

  EphemeralRetentionSecs:
    Type: Number
    Default: 600
    MinValue: 1
    MaxValue: 315360000
    Description: 'Maximum retention for expired in-memory state in seconds'

  MaxAdmissionSources:
    Type: Number
    Default: 4096
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum concurrently tracked network-source admission buckets'

  RecordRetentionSecs:
    Type: Number
    Default: 31536000
    MinValue: 1
    MaxValue: 315360000
    Description: 'Maximum retained age for expirable relay records in seconds'

  MaxKnownPeers:
    Type: Number
    Default: 100000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum retained peer records'

  MaxPosts:
    Type: Number
    Default: 1000000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum retained wall and community post records'

  MaxGrants:
    Type: Number
    Default: 500000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum retained wall-access grant records'

  MaxIntroductions:
    Type: Number
    Default: 100000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum retained introduction records'

  MaxSocialEvents:
    Type: Number
    Default: 1000000
    MinValue: 1
    MaxValue: 1000000000
    Description: 'Maximum retained social-event records'

  CommunityName:
    Type: String
    Default: 'Harbor Community'
    Description: 'Name for your community (shown to peers who join)'

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]

Resources:
  # VPC for the relay server
  RelayVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RelayVPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RelayVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  # Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RelayVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Security Group
  RelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${AWS::StackName} Harbor community relay server'
      VpcId: !Ref RelayVPC
      SecurityGroupIngress:
        # libp2p relay port (TCP)
        - IpProtocol: tcp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIp: 0.0.0.0/0
          Description: libp2p relay TCP
        # libp2p relay port (UDP for QUIC)
        - IpProtocol: udp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIp: 0.0.0.0/0
          Description: libp2p relay UDP/QUIC
        # SSH access (only if key pair provided)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # SSM Parameter to store the relay address (managed by CloudFormation)
  RelayAddressParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/harbor/${AWS::StackName}/relay-address'
      Type: String
      Value: 'Starting up... check back in 2 minutes'
      Description: !Sub 'Full relay address for Harbor (${AWS::StackName}) - copy this into the app'
      Tags:
        Application: harbor-chat

  # IAM Role for EC2
  RelayInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: RelaySSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read/write relay address, identity key, and EIP allocation ID in SSM
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/harbor/${AWS::StackName}/relay-address'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/harbor/${AWS::StackName}/identity-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/harbor/${AWS::StackName}/eip-allocation-id'
              # Manage Elastic IP (allocate, associate, describe, tag)
              - Effect: Allow
                Action:
                  - ec2:AllocateAddress
                  - ec2:AssociateAddress
                  - ec2:DescribeAddresses
                  - ec2:CreateTags
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  RelayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RelayInstanceRole

  # EC2 Instance
  RelayInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !Ref RelayInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref RelaySecurityGroup
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 077
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          echo "=== Starting Harbor Community Relay Setup ==="
          echo "Region: ${AWS::Region}"
          echo "Stack: ${AWS::StackName}"
          echo "RelayPort: ${RelayPort}"
          echo "CommunityName: ${CommunityName}"

          SERVICE_NAME="${AWS::StackName}-community-relay"
          BINARY_URL="https://github.com/bakobiibizo/harbor/raw/main/relay-server/bin/harbor-relay"
          EXPECTED_SHA256="b843530a361220a42d97df60ec1f7236658992fadd78e19d9b66d9f85aee9144"
          IDENTITY_SSM_PARAM="/harbor/${AWS::StackName}/identity-key"
          IDENTITY_KEY_PATH="/root/.config/harbor-relay/id.key"
          EIP_SSM_PARAM="/harbor/${AWS::StackName}/eip-allocation-id"
          REGION="${AWS::Region}"

          # Get IMDS token (valid for 6 hours, reused throughout script)
          IMDS_TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null)
          INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
          echo "Instance ID: $INSTANCE_ID"

          # ---------------------------------------------------------------
          # 1. Download and verify binary
          # ---------------------------------------------------------------
          echo "Downloading pre-compiled relay binary..."
          curl -L --retry 3 --retry-delay 5 -o /usr/local/bin/harbor-relay "$BINARY_URL"

          if [ ! -s /usr/local/bin/harbor-relay ]; then
            echo "ERROR: Binary download failed or file is empty"
            exit 1
          fi

          echo "Verifying binary integrity..."
          ACTUAL_SHA256=$(sha256sum /usr/local/bin/harbor-relay | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA256 mismatch!"
            echo "  Expected: $EXPECTED_SHA256"
            echo "  Got:      $ACTUAL_SHA256"
            exit 1
          fi
          echo "SHA256 verified OK"
          chmod +x /usr/local/bin/harbor-relay

          # ---------------------------------------------------------------
          # 2. Restore identity key from SSM (or generate on first boot)
          # ---------------------------------------------------------------
          # HARBOR_KEY_RESTORE_BEGIN
          install -d -m 0700 "$(dirname "$IDENTITY_KEY_PATH")"
          if [ -e "$IDENTITY_KEY_PATH" ] || [ -L "$IDENTITY_KEY_PATH" ]; then
            echo "ERROR: Refusing to overwrite an existing relay identity path"
            exit 1
          fi
          IDENTITY_ENCODED=$(mktemp "$IDENTITY_KEY_PATH.encoded.XXXXXX")
          IDENTITY_RESTORE=$(mktemp "$IDENTITY_KEY_PATH.restore.XXXXXX")
          IDENTITY_FETCH_ERROR=$(mktemp "$IDENTITY_KEY_PATH.fetch-error.XXXXXX")
          IDENTITY_EXPORT=""
          cleanup_identity_material() {
            rm -f "$IDENTITY_ENCODED"
            rm -f "$IDENTITY_RESTORE"
            rm -f "$IDENTITY_FETCH_ERROR"
            if [ -n "$IDENTITY_EXPORT" ]; then rm -f "$IDENTITY_EXPORT"; fi
          }
          trap cleanup_identity_material EXIT HUP INT TERM
          echo "Checking SSM for existing identity key..."
          if aws ssm get-parameter \
              --name "$IDENTITY_SSM_PARAM" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text \
              --region "$REGION" > "$IDENTITY_ENCODED" 2> "$IDENTITY_FETCH_ERROR"; then
            if ! base64 --decode "$IDENTITY_ENCODED" > "$IDENTITY_RESTORE"; then
              echo "ERROR: Stored relay identity key is not valid base64"
              exit 1
            fi
            if [ ! -s "$IDENTITY_RESTORE" ]; then
              echo "ERROR: Stored relay identity key is empty"
              exit 1
            fi
            echo "Found existing identity key in SSM — restoring for consistent peer ID"
            chmod 0600 "$IDENTITY_RESTORE"
            mv -T "$IDENTITY_RESTORE" "$IDENTITY_KEY_PATH"
            KEY_IS_NEW=false
          elif grep -q 'ParameterNotFound' "$IDENTITY_FETCH_ERROR"; then
            echo "No existing identity key — relay will generate a new one on first start"
            KEY_IS_NEW=true
          else
            echo "ERROR: Unable to determine whether an identity key exists in SSM"
            exit 1
          fi
          rm -f "$IDENTITY_ENCODED" "$IDENTITY_FETCH_ERROR"
          # HARBOR_KEY_RESTORE_END
          mkdir -p /var/lib/harbor-relay/data

          # ---------------------------------------------------------------
          # 3. Restore or allocate Elastic IP
          # ---------------------------------------------------------------
          echo "Checking SSM for existing Elastic IP..."
          EIP_ALLOC_ID=$(aws ssm get-parameter \
            --name "$EIP_SSM_PARAM" \
            --query 'Parameter.Value' \
            --output text \
            --region $REGION 2>/dev/null || true)

          PUBLIC_IP=""

          if [ -n "$EIP_ALLOC_ID" ] && [ "$EIP_ALLOC_ID" != "None" ]; then
            # Verify the EIP still exists (may have been manually released)
            PUBLIC_IP=$(aws ec2 describe-addresses \
              --allocation-ids "$EIP_ALLOC_ID" \
              --query 'Addresses[0].PublicIp' \
              --output text \
              --region $REGION 2>/dev/null || true)

            if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
              echo "Reusing existing Elastic IP: $PUBLIC_IP ($EIP_ALLOC_ID)"
            else
              echo "Previous EIP $EIP_ALLOC_ID no longer exists — allocating new one"
              EIP_ALLOC_ID=""
              PUBLIC_IP=""
            fi
          fi

          if [ -z "$EIP_ALLOC_ID" ] || [ "$EIP_ALLOC_ID" = "None" ]; then
            echo "Allocating new Elastic IP..."
            EIP_ALLOC_ID=$(aws ec2 allocate-address \
              --domain vpc \
              --tag-specifications "ResourceType=elastic-ip,Tags=[{Key=Name,Value=${AWS::StackName}-eip},{Key=Application,Value=harbor-chat}]" \
              --query 'AllocationId' \
              --output text \
              --region $REGION)

            PUBLIC_IP=$(aws ec2 describe-addresses \
              --allocation-ids "$EIP_ALLOC_ID" \
              --query 'Addresses[0].PublicIp' \
              --output text \
              --region $REGION)

            echo "Allocated new Elastic IP: $PUBLIC_IP ($EIP_ALLOC_ID)"

            # Save to SSM so it survives stack rebuilds
            aws ssm put-parameter \
              --name "$EIP_SSM_PARAM" \
              --value "$EIP_ALLOC_ID" \
              --type String \
              --overwrite \
              --region $REGION
            echo "Saved EIP allocation ID to SSM"
          fi

          # Associate EIP with this instance
          echo "Associating Elastic IP $PUBLIC_IP with instance $INSTANCE_ID..."
          aws ec2 associate-address \
            --instance-id "$INSTANCE_ID" \
            --allocation-id "$EIP_ALLOC_ID" \
            --allow-reassociation \
            --region $REGION
          echo "Elastic IP associated"

          # ---------------------------------------------------------------
          # 4. Create and start systemd service
          # ---------------------------------------------------------------
          echo "Creating systemd service: $SERVICE_NAME"
          cat > /etc/systemd/system/$SERVICE_NAME.service << SERVICEEOF
          [Unit]
          Description=Harbor Community Relay Server (${AWS::StackName})
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=10
          UMask=0077
          Environment=RUST_LOG=info
          Environment=HARBOR_RELAY_MAX_RESERVATIONS=${MaxReservations}
          Environment=HARBOR_RELAY_MAX_RESERVATIONS_PER_PEER=${MaxReservationsPerPeer}
          Environment=HARBOR_RELAY_MAX_CIRCUITS=${MaxCircuits}
          Environment=HARBOR_RELAY_MAX_CIRCUITS_PER_PEER=${MaxCircuitsPerPeer}
          Environment=HARBOR_RELAY_RESERVATION_DURATION_SECS=${ReservationDurationSecs}
          Environment=HARBOR_RELAY_MAX_CIRCUIT_DURATION_SECS=${MaxCircuitDurationSecs}
          Environment=HARBOR_RELAY_MAX_CIRCUIT_BYTES=${MaxCircuitBytes}
          Environment=HARBOR_RELAY_IDLE_CONNECTION_TIMEOUT_SECS=${IdleConnectionTimeoutSecs}
          Environment=HARBOR_RELAY_RESERVATION_ADMISSION_PER_PEER=${ReservationAdmissionPerPeer}
          Environment=HARBOR_RELAY_RESERVATION_ADMISSION_PER_IP=${ReservationAdmissionPerIp}
          Environment=HARBOR_RELAY_CIRCUIT_ADMISSION_PER_PEER=${CircuitAdmissionPerPeer}
          Environment=HARBOR_RELAY_CIRCUIT_ADMISSION_PER_IP=${CircuitAdmissionPerIp}
          Environment=HARBOR_RELAY_ADMISSION_WINDOW_SECS=${AdmissionWindowSecs}
          Environment=HARBOR_RELAY_RATE_LIMIT_MAX_REQUESTS=${RateLimitMaxRequests}
          Environment=HARBOR_RELAY_RATE_LIMIT_WINDOW_SECS=${RateLimitWindowSecs}
          Environment=HARBOR_RELAY_RATE_LIMITER_CLEANUP_INTERVAL_SECS=${RateLimiterCleanupIntervalSecs}
          Environment=HARBOR_RELAY_ABUSE_PEER_LIMIT=${AbusePeerLimit}
          Environment=HARBOR_RELAY_ABUSE_NETWORK_LIMIT=${AbuseNetworkLimit}
          Environment=HARBOR_RELAY_ABUSE_TARGET_LIMIT=${AbuseTargetLimit}
          Environment=HARBOR_RELAY_ABUSE_ACTION_LIMIT=${AbuseActionLimit}
          Environment=HARBOR_RELAY_ABUSE_GLOBAL_LIMIT=${AbuseGlobalLimit}
          Environment=HARBOR_RELAY_ABUSE_WINDOW_SECS=${AbuseWindowSecs}
          Environment=HARBOR_RELAY_MAX_STORAGE_BYTES=${MaxStorageBytes}
          Environment=HARBOR_RELAY_MAX_EPHEMERAL_ENTRIES=${MaxEphemeralEntries}
          Environment=HARBOR_RELAY_EPHEMERAL_RETENTION_SECS=${EphemeralRetentionSecs}
          Environment=HARBOR_RELAY_MAX_ADMISSION_SOURCES=${MaxAdmissionSources}
          Environment=HARBOR_RELAY_RECORD_RETENTION_SECS=${RecordRetentionSecs}
          Environment=HARBOR_RELAY_MAX_KNOWN_PEERS=${MaxKnownPeers}
          Environment=HARBOR_RELAY_MAX_POSTS=${MaxPosts}
          Environment=HARBOR_RELAY_MAX_GRANTS=${MaxGrants}
          Environment=HARBOR_RELAY_MAX_INTRODUCTIONS=${MaxIntroductions}
          Environment=HARBOR_RELAY_MAX_SOCIAL_EVENTS=${MaxSocialEvents}
          ExecStart=/usr/local/bin/harbor-relay --port ${RelayPort} --announce-ip $PUBLIC_IP --identity-namespace ${IdentityNamespace} --community --community-name "${CommunityName}" --data-dir /var/lib/harbor-relay/data
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          echo "Starting relay service..."
          systemctl daemon-reload
          systemctl enable $SERVICE_NAME
          systemctl start $SERVICE_NAME

          # ---------------------------------------------------------------
          # 5. Wait for startup, extract peer ID
          # ---------------------------------------------------------------
          echo "Waiting for relay to start..."
          RELAY_PEER_ID=""
          for i in $(seq 1 30); do
            sleep 2
            RELAY_PEER_ID=$(journalctl -u $SERVICE_NAME --no-pager 2>/dev/null | grep 'Local Peer ID:' | head -1 | sed 's/.*Local Peer ID: //')
            if [ -n "$RELAY_PEER_ID" ]; then
              echo "Peer ID: $RELAY_PEER_ID"
              break
            fi
            echo "Waiting for peer ID (attempt $i/30)..."
          done

          if [ -z "$RELAY_PEER_ID" ]; then
            echo "ERROR: Could not extract peer ID after 60 seconds"
            journalctl -u $SERVICE_NAME --no-pager -n 50
            exit 1
          fi

          # Verify port is listening
          for i in $(seq 1 10); do
            if ss -tlnp | grep -q ":${RelayPort}"; then
              echo "Port ${RelayPort} is listening"
              break
            fi
            echo "Waiting for port ${RelayPort} (attempt $i/10)..."
            sleep 2
          done

          systemctl status $SERVICE_NAME --no-pager || true

          # ---------------------------------------------------------------
          # 6. Persist identity key and relay address to SSM
          # ---------------------------------------------------------------
          # HARBOR_KEY_PERSIST_BEGIN
          if [ ! -f "$IDENTITY_KEY_PATH" ] || [ -L "$IDENTITY_KEY_PATH" ]; then
            echo "ERROR: Relay identity key is not a regular non-symlink file"
            exit 1
          fi
          EXPECTED_KEY_UID=$(id -u)
          if [ "$(stat -c '%u:%a' "$IDENTITY_KEY_PATH")" != "$EXPECTED_KEY_UID:600" ]; then
            echo "ERROR: Relay identity key must be owned by the service user with mode 0600"
            exit 1
          fi
          if [ "$KEY_IS_NEW" = "true" ]; then
            echo "Saving new identity key to SSM..."
            IDENTITY_EXPORT=$(mktemp "$(dirname "$IDENTITY_KEY_PATH")/.identity-export.XXXXXX")
            base64 -w0 "$IDENTITY_KEY_PATH" > "$IDENTITY_EXPORT"
            aws ssm put-parameter \
              --name "$IDENTITY_SSM_PARAM" \
              --value "file://$IDENTITY_EXPORT" \
              --type SecureString \
              --overwrite \
              --region "$REGION"
            rm -f "$IDENTITY_EXPORT"
            IDENTITY_EXPORT=""
            echo "Identity key saved to SSM"
          fi
          # HARBOR_KEY_PERSIST_END

          RELAY_ADDRESS="/ip4/$PUBLIC_IP/tcp/${RelayPort}/p2p/$RELAY_PEER_ID"

          aws ssm put-parameter \
            --name "/harbor/${AWS::StackName}/relay-address" \
            --value "$RELAY_ADDRESS" \
            --type String \
            --overwrite \
            --region $REGION

          echo "=== SUCCESS ==="
          echo "YOUR RELAY ADDRESS (copy this to Harbor):"
          echo "$RELAY_ADDRESS"
          echo "Community: ${CommunityName}"
          echo "Service: $SERVICE_NAME"
          echo ""
          echo "This address is stable across rebuilds (same stack name = same IP + peer ID)"
          echo "=== Setup Complete ==="

      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-server'
        - Key: Application
          Value: harbor-chat

Outputs:
  GetRelayAddress:
    Description: 'STEP 1: Run this command to get your full relay address'
    Value: !Sub "aws ssm get-parameter --name '/harbor/${AWS::StackName}/relay-address' --query 'Parameter.Value' --output text --region ${AWS::Region}"

  SSMConsoleLink:
    Description: 'STEP 1 (alternative): View relay address in the AWS console'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/parameters/harbor/${AWS::StackName}/relay-address/description?region=${AWS::Region}'

  Step2Instructions:
    Description: 'STEP 2: Paste the relay address into Harbor'
    Value: 'Open Harbor > Network > Advanced > Add Relay Address'

  ServiceName:
    Description: 'Systemd service name (for troubleshooting)'
    Value: !Sub '${AWS::StackName}-community-relay'

  CommunityNameOutput:
    Description: 'Community name'
    Value: !Ref CommunityName

  IdentityNote:
    Description: 'Identity persistence'
    Value: !Sub 'IP and peer ID are stored in SSM under /harbor/${AWS::StackName}/. Redeploying with the same stack name reuses both.'

  EstimatedMonthlyCost:
    Description: 'Cost: FREE for 12 months, then ~$9/month'
    Value: 'AWS Free Tier: 750 hours/month for first year'
