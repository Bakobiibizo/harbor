name: harbor
version: 1.3.0
description: Decentralized P2P chat — Tauri + React + libp2p
compliance: ISO9001, ITIL-Change-Enablement, CRQ-OBSERVE-001

stages:
  - name: observe
    prime: 2
    command: cd relay-server && cargo check --release
    description: Verify relay-server Rust deps resolve

  - name: orient
    prime: 3
    command: cd relay-server && cargo test --release
    description: Run relay-server tests

  - name: decide
    prime: 5
    command: cd relay-server && cargo build --release
    description: Build relay-server binary

  - name: act
    prime: 7
    command: npm audit
    description: Audit JS dependencies for vulnerabilities

  - name: witness
    prime: 11
    command: sha256sum relay-server/target/release/harbor-relay-server
    description: Generate DA51 witness hash

deploy:
  target: /var/lib/zos/bin/
  service: harbor-shard58
  reload: systemctl --user restart harbor-shard58.service

sop:
  approval: CRQ-OBSERVE-001
  mod: [71, 59, 47]
